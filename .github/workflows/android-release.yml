name: Android APK

# Every push to main publishes an installable APK to GitHub Releases.
# `workflow_dispatch` lets you re-run it by hand from the Actions tab
# without pushing anything.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for `gh release create` to write to the repo. The default token
# is read-only on newer repos, so this is not optional.
permissions:
  contents: write

# A quick follow-up push shouldn't leave two builds racing to publish.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: fintrack-${{ github.run_number }}.apk

jobs:
  build:
    runs-on: ubuntu-latest

    # The Flutter app lives in flutter/, not the repo root — the Django app
    # is at the root. Every run step below needs this.
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      # Java 17: android/app/build.gradle.kts pins source/target
      # compatibility and the Kotlin jvmTarget to 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned rather than tracking `stable` so a Flutter release can't
      # change the build out from under you. Matches the version this was
      # developed against.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Gate the APK on the same checks used locally — publishing a build
      # that doesn't analyze clean or pass its tests defeats the point.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # --build-number bumps versionCode per run. Without it every APK ships
      # versionCode 1 (from pubspec's 1.0.0+1) and Android refuses to install
      # one over another.
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Name the APK after the build
        run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${APK_NAME}"

      # Written to a file rather than passed inline: release notes are prose
      # with backticks and quotes in them, and shell-quoting that inside a
      # YAML scalar is a reliable way to break a workflow.
      - name: Compose release notes
        run: |
          cat > /tmp/notes.md <<'NOTES'
          Automated build. Install it on a device or emulator to try this commit.

          > **Signed with a debug key.** `android/app/build.gradle.kts` still falls
          > back to `signingConfigs.getByName("debug")` for release builds, and CI
          > generates a fresh debug keystore on every run. These APKs are fine for
          > testing, but each one is signed differently — so Android will refuse to
          > install one over another (uninstall first), and none of them are fit for
          > the Play Store. Adding a real keystore and signing config fixes both.
          NOTES
          printf '\nCommit: %s\n' "${GITHUB_SHA}" >> /tmp/notes.md

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "build/app/outputs/flutter-apk/${APK_NAME}" \
            --title "Build ${{ github.run_number }}" \
            --target "${GITHUB_SHA}" \
            --notes-file /tmp/notes.md
