org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# The Flutter template set this to false. It has to be true here.
#
# file_picker 11.0.3 decides whether to apply the Kotlin Gradle Plugin from
# the AGP *version* alone (AGP >= 9 => "built-in Kotlin will handle it"),
# without reading this opt-out flag. With AGP 9.0.1 and the flag false, it
# applies no Kotlin plugin and AGP compiles no Kotlin, so its Kotlin-only
# FilePickerPlugin never makes it into the AAR and the app fails to compile
# against the generated plugin registrant.
#
# The Firebase plugins read this property properly and apply KGP themselves
# when it's false, which is why they built and file_picker didn't. Setting
# it true satisfies both: file_picker gets the built-in Kotlin it assumes,
# and the Firebase plugins detect it and stand down. It also matches the
# direction Flutter is pushing — it already warns that plugins applying
# their own KGP will stop working.
android.builtInKotlin=true
